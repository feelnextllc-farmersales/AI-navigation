<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI ACTION SELF｜自分で作るための設計サービス</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/common.js"></script>
<script>renderHeader();</script>
<main>
  <section class="hero">
    <div class="wrap">
      <h1>AI ACTION SELF</h1>
      <p class="lead">ご自身がお使いのAIに、そのまま渡せる「AIへの指示（プロンプト）」を作成します。</p>
      <div class="price-card">
        <span class="tag">AI ACTION SELF</span>
        <div class="amount">9,800<span>円（税込）〜</span></div>
        <p class="small">内容の複雑さによって、料金が変わる場合があります。</p>
      </div>
      <!-- Stripe Payment Link に置き換えてください。リダイレクト先: thanks.html?product=action-self -->
      <a class="btn btn-primary btn-block" href="https://buy.stripe.com/REPLACE_WITH_ACTION_SELF_PAYMENT_LINK">
        9,800円で購入して質問に進む
      </a>
      <p class="small center" style="margin-top:14px;">
        すでに購入済みの方は<a href="#wizard-section" id="tryFreeLink">こちらから質問に進む</a>ことができます。
      </p>
    </div>
  </section>
  <section id="wizard-section" class="hidden">
    <div class="wrap"><div class="card" id="wizard-app"></div></div>
  </section>
</main>
<script>renderFooter();</script>
<script src="js/action-self.js"></script>
<script>
document.getElementById('tryFreeLink').addEventListener('click', function(e){ e.preventDefault(); startSelfWizard(); });
</script>
</body>
</html>
