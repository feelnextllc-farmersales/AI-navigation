<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご購入ありがとうございます｜AI NAVIGATION</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/common.js"></script>
<script>renderHeader();</script>
<main>
  <section class="hero">
    <div class="wrap center">
      <h1>ご購入ありがとうございます。</h1>
      <p class="lead">ここからサービスを始めましょう。</p>

      <div class="notice-box" style="text-align:left;">
        ・このサービスでは、入力データを保存しません。<br>
        ・ページを離れる前に、必要な成果物（AI活用チャート／プロンプト等）を保存・コピーしてください。<br>
        ・入力内容を再表示することはできませんので、あらかじめご了承ください。
      </div>

      <a class="btn btn-primary btn-block" id="startBtn" href="navigation.html">AI NAVIGATIONを始める</a>
    </div>
  </section>
</main>
<script>renderFooter();</script>
<script>
  // Route the CTA based on which product was purchased, if known.
  const params = new URLSearchParams(location.search);
  const product = params.get('product');
  const map = {
    'navigation': ['navigation.html', 'AI NAVIGATIONを始める'],
    'action-self': ['action-self.html', 'AI ACTION SELFを始める'],
    'action-request': ['action-request.html', 'AI ACTION REQUESTを始める'],
  };
  if(product && map[product]){
    const btn = document.getElementById('startBtn');
    btn.href = map[product][0];
    btn.textContent = map[product][1];
  }
</script>
</body>
</html>
